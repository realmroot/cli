version: 2

project_name: realmroot

builds:
  - id: realmroot
    main: .
    binary: realmroot
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/realmroot/cli/internal/buildinfo.Version=v{{ .Version }}
      - -X github.com/realmroot/cli/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/realmroot/cli/internal/buildinfo.BuildTime={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - realmroot
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
